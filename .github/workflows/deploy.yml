name: Deploy Backend

on:
  push:
    branches:
      - develop

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.IP }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          password: ${{ secrets.PASSWD }}
          script: |
            cd ~/chauchaapp-backend/chauchaapp-backend
            git fetch origin
            git checkout develop
            git pull --ff-only origin develop
            docker compose --profile production down
            docker compose --profile production up -d --build
            until docker exec chauchaapp-postgres pg_isready -U postgres -q; do sleep 2; done
            docker exec chauchaapp-postgres psql -U postgres -tc \
              "SELECT 1 FROM pg_database WHERE datname='chauchaapp_db_prod'" | grep -q 1 || {
              docker exec chauchaapp-postgres psql -U postgres -c "CREATE DATABASE chauchaapp_db_prod;"
              docker exec chauchaapp-postgres psql -U postgres -d chauchaapp_db_prod -f /docker-scripts/schema.sql
              docker exec chauchaapp-postgres psql -U postgres -d chauchaapp_db_prod -f /docker-scripts/seed-qa.sql
            }
